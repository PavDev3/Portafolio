<section>
  <h2 class="cmd-line"><span class="prompt"></span>cat ~/.history | tail -n 3</h2>

  <ol class="timeline">
    @for (entry of entries; track entry.company) {
      <li class="entry" [class.current]="entry.current">
        <div class="entry-head">
          <span class="period">{{ entry.period }}</span>
          @if (entry.current) {
            <span class="badge">activo</span>
          }
        </div>
        <h3>{{ entry.role }} <span class="at">@</span> {{ entry.company }}</h3>
        <p class="location">{{ entry.location }}</p>
        <ul class="highlights">
          @for (h of entry.highlights; track h) {
            <li>{{ h }}</li>
          }
        </ul>
      </li>
    }
  </ol>
</section>
