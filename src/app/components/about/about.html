<section>
  <h2 class="cmd-line"><span class="prompt"></span>cat ~/about.md</h2>

  <p class="intro" [innerHTML]="t().about.intro"></p>

  <p class="meta">
    <span class="k">loc:</span> Cádiz, España &nbsp;·&nbsp; <span class="k">gh:</span>
    <a href="https://github.com/PavDev3" target="_blank" rel="noopener noreferrer"
      >github.com/PavDev3</a
    >
    &nbsp;·&nbsp; <span class="k">web:</span>
    <a href="https://www.pablonunez.dev" target="_blank" rel="noopener noreferrer"
      >pablonunez.dev</a
    >
  </p>

  <h3 class="cmd-line secondary"><span class="prompt"></span>cat ~/.config/education</h3>
  <ul class="education-list">
    @for (edu of education(); track edu.title) {
      <li>
        <span class="period">{{ edu.period }}</span>
        <span class="title">{{ edu.title }}</span>
        <span class="institution">— {{ edu.institution }}</span>
      </li>
    }
  </ul>
</section>
